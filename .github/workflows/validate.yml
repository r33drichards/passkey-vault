name: Validate vault

on:
  push:
    branches: [main, fix/ssh-sensitive-action-confirmation]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run check
      - run: npm run build
      - run: npm test
