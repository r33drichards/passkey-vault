name: Deploy Serverless Hill Climb
on:
  push:
    branches: [smoke/cloudflare-hello-20261026]
    paths: [.github/workflows/serverless-hill-climb.yml, proofs/serverless-hill-climb/**]
permissions:
  contents: read
concurrency:
  group: serverless-hill-climb-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unpack private Hillclimb source
        env:
          HILLCLIMB_BUILD_KEY: ${{ secrets.HILLCLIMB_BUILD_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/hillclimb"
          openssl enc -d -aes-256-cbc -pbkdf2 -in proofs/serverless-hill-climb/source.tar.enc -out "$RUNNER_TEMP/hillclimb-source.tar" -pass env:HILLCLIMB_BUILD_KEY
          echo "c301aaae3caa3c3bd57750f9bf6debb111ac4c7214ab1e1302d8c5190b49c1c6  $RUNNER_TEMP/hillclimb-source.tar" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/hillclimb-source.tar" -C "$RUNNER_TEMP/hillclimb"
      - name: Test and bundle Pi transport
        working-directory: ${{ runner.temp }}/hillclimb
        run: npm ci --no-audit --no-fund && npm test && npm run build
      - name: Deploy isolated hill climb Worker
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          LAMBDA_CLIENT_SECRET: ${{ secrets.HILL_LAMBDA_CLIENT_SECRET }}
          HILL_VERIFY_KEY: ${{ secrets.HILL_LAMBDA_VERIFY_KEY }}
          HILL_GIT_RELAY_KEY: ${{ secrets.HILL_GIT_RELAY_KEY }}
          HILLCLIMB_ENABLED: 'false'
          HILLCLIMB_LAMBDA_READY: 'false'
        run: python3 "$RUNNER_TEMP/hillclimb/deploy.py"
